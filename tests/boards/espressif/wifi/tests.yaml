common:
  integration_platforms:
    - esp32c3_devkitc
tests:
  esp.wifi.sec.none:
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp8684_devkitm
  esp.wifi.sec.wpa2:
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_configs:
      - CONFIG_WIFI_TEST_AUTH_MODE_WPA2=y
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp8684_devkitm
  esp.wifi.sec.wpa2.pm:
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_args:
      - SNIPPET=espressif-pm
    extra_configs:
      - CONFIG_WIFI_TEST_AUTH_MODE_WPA2=y
      - CONFIG_HEAP_MEM_POOL_ADD_SIZE_WIFI_TEST=16384
      - CONFIG_LOG=y
      - CONFIG_SOC_LOG_LEVEL_DBG=y
      - CONFIG_SOC_ESP32_PM_SLEEP_STATS=y
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - esp8684_devkitm
  esp.wifi.sec.wpa3:
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_configs:
      - CONFIG_WIFI_TEST_AUTH_MODE_WPA3=y
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp8684_devkitm
  esp.wifi.pmksa_import:
    build_only: true
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_configs:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
      - CONFIG_ESP32_WIFI_ENTERPRISE=y
      - CONFIG_WIFI_MGMT_PMKSA_IMPORT=y
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
  esp.wifi.pmksa_export:
    build_only: true
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_configs:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
      - CONFIG_ESP32_WIFI_ENTERPRISE=y
      - CONFIG_WIFI_MGMT_PMKSA_EXPORT=y
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
  esp.wifi.pmksa_import_export:
    build_only: true
    tags: wifi
    filter: CONFIG_WIFI_ESP32
    extra_configs:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
      - CONFIG_ESP32_WIFI_ENTERPRISE=y
      - CONFIG_WIFI_MGMT_PMKSA_IMPORT=y
      - CONFIG_WIFI_MGMT_PMKSA_EXPORT=y
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
